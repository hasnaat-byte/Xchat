{% extends "base.html" %}

{% block content %}

<h1>Users</h1>

<form method="GET">
    <input
        type="text"
        name="q"
        placeholder="Search..."
        value="{{ query }}"
    >
    <button>Search</button>
</form>

{% for user in users %}

<p>
    <a href="{% url 'user_profile' user.username %}">
        {{ user.username }}
    </a>
</p>

{% empty %}

<p>No users found.</p>

{% endfor %}

{% endblock %}
